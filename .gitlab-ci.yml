variables:
  HARBOR_IMAGE: registry.hanada.info/openresty/openresty
  DOCKERHUB_IMAGE: docker.io/hanadalee/openresty
  GHCR_IMAGE: ghcr.io/hanadalee/openresty

stages:
  - build
  - manifest
  - release

.docker-job:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - |
      set -eu

      run_patch_tests() {
        test_image="$1"
        test_harness_root="$(mktemp -d)"

        git clone --depth=1 \
          https://github.com/openresty/test-nginx.git \
          "$test_harness_root/test-nginx"
        git clone --depth=1 \
          https://github.com/nginx/nginx-tests.git \
          "$test_harness_root/nginx-tests"

        if ! docker run --rm \
          --volume "$CI_PROJECT_DIR/t:/input/tests:ro" \
          --volume "$test_harness_root/test-nginx:/input/test-nginx:ro" \
          --volume "$test_harness_root/nginx-tests:/input/nginx-tests:ro" \
          "$test_image" \
          bash -c '
            set -euo pipefail

            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              --no-install-recommends \
              perl \
              libtest-base-perl \
              libtext-diff-perl \
              libtest-longstring-perl \
              libwww-perl \
              libipc-run-perl \
              liburi-perl \
              liblist-moreutils-perl

            mkdir -p /test-work/tests /test-work/harnesses
            cp -a /input/tests/. /test-work/tests/
            cp -a /input/test-nginx /test-work/harnesses/test-nginx
            cp -a /input/nginx-tests /test-work/harnesses/nginx-tests

            TEST_NGINX_BINARY=/usr/local/openresty/sbin/nginx \
              TEST_NGINX_ROOT=/test-work/harnesses/test-nginx \
              NGINX_TESTS_ROOT=/test-work/harnesses/nginx-tests \
              bash /test-work/tests/run.sh
          '; then
          rm -rf "$test_harness_root"
          return 1
        fi

        rm -rf "$test_harness_root"
      }

      RESTY_VERSION="$(
        sed -n 's/^ARG RESTY_VERSION="\([^"]*\)"[[:space:]]*$/\1/p' \
          Dockerfile | head -n 1
      )"
      RESTY_RELEASE="$(
        sed -n 's/^ARG RESTY_RELEASE="\([^"]*\)"[[:space:]]*$/\1/p' \
          Dockerfile | head -n 1
      )"

      if [ -z "$RESTY_VERSION" ] || [ -z "$RESTY_RELEASE" ]; then
        echo "Failed to read RESTY_VERSION or RESTY_RELEASE from Dockerfile" >&2
        exit 1
      fi

      VERSION="${RESTY_VERSION}.${RESTY_RELEASE}"
      if ! printf '%s\n' "$VERSION" |
           grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "Invalid version from Dockerfile: $VERSION" >&2
        exit 1
      fi

      RELEASE_NEEDED=false

      read_version_at() {
        ref="$1"

        resty="$(git show "${ref}:Dockerfile" |
          sed -n 's/^ARG RESTY_VERSION="\([^"]*\)"[[:space:]]*$/\1/p' |
          head -n 1)"
        release="$(git show "${ref}:Dockerfile" |
          sed -n 's/^ARG RESTY_RELEASE="\([^"]*\)"[[:space:]]*$/\1/p' |
          head -n 1)"

        if [ -z "$resty" ] || [ -z "$release" ]; then
          echo "Failed to read version from ${ref}:Dockerfile" >&2
          return 1
        fi

        printf '%s.%s\n' "$resty" "$release"
      }

      git fetch --force --tags origin

      if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
        echo "Version ${VERSION} is already tagged; running tests only."
      elif [ "${CI_PIPELINE_SOURCE:-}" = "push" ] &&
           [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] &&
           [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        if ! git cat-file -e "${CI_COMMIT_BEFORE_SHA}^{commit}" 2>/dev/null; then
          git fetch --no-tags origin "$CI_COMMIT_BEFORE_SHA"
        fi

        PREVIOUS_VERSION="$(read_version_at "$CI_COMMIT_BEFORE_SHA")"
        if [ "$VERSION" != "$PREVIOUS_VERSION" ]; then
          RELEASE_NEEDED=true
        else
          echo "Version remains ${VERSION}; running tests only."
        fi
      else
        RELEASE_NEEDED=true
      fi

      export VERSION RESTY_VERSION RESTY_RELEASE RELEASE_NEEDED

      if [ "$RELEASE_NEEDED" = true ]; then
        printf '%s' "$HARBOR_PASSWORD" |
          docker login registry.hanada.info --username "$HARBOR_USERNAME" --password-stdin
        printf '%s' "$DOCKERHUB_PASSWORD" |
          docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
        printf '%s' "$GHCR_TOKEN" |
          docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      fi

build-amd64:
  extends: .docker-job
  stage: build
  tags:
    - debian-x86_64
  script:
    - |
      docker build \
        --build-arg RESTY_VERSION="${RESTY_VERSION}" \
        --build-arg RESTY_RELEASE="${RESTY_RELEASE}" \
        --tag "${HARBOR_IMAGE}:${VERSION}-amd64" \
        --tag "${DOCKERHUB_IMAGE}:${VERSION}-amd64" \
        --tag "${GHCR_IMAGE}:${VERSION}-amd64" \
        .

      run_patch_tests "${HARBOR_IMAGE}:${VERSION}-amd64"

      if [ "$RELEASE_NEEDED" = true ]; then
        for image in "$HARBOR_IMAGE" "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
          docker push "${image}:${VERSION}-amd64"
        done
      fi

build-arm64:
  extends: .docker-job
  stage: build
  tags:
    - debian-aarch64
  script:
    - |
      docker build \
        --build-arg RESTY_VERSION="${RESTY_VERSION}" \
        --build-arg RESTY_RELEASE="${RESTY_RELEASE}" \
        --tag "${HARBOR_IMAGE}:${VERSION}-arm64" \
        --tag "${DOCKERHUB_IMAGE}:${VERSION}-arm64" \
        --tag "${GHCR_IMAGE}:${VERSION}-arm64" \
        .

      run_patch_tests "${HARBOR_IMAGE}:${VERSION}-arm64"

      if [ "$RELEASE_NEEDED" = true ]; then
        for image in "$HARBOR_IMAGE" "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
          docker push "${image}:${VERSION}-arm64"
        done
      fi

create-manifest:
  extends: .docker-job
  stage: manifest
  tags:
    - debian-x86_64
  needs:
    - build-amd64
    - build-arm64
  script:
    - |
      if [ "$RELEASE_NEEDED" != true ]; then
        echo "Version is unchanged; skipping image publication."
        exit 0
      fi

      for image in "$HARBOR_IMAGE" "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
        docker manifest inspect "${image}:${VERSION}-amd64"
        docker manifest inspect "${image}:${VERSION}-arm64"

        docker manifest create --amend "${image}:${VERSION}" \
          --amend "${image}:${VERSION}-amd64" \
          --amend "${image}:${VERSION}-arm64"
        docker manifest push --purge "${image}:${VERSION}"

        docker manifest create --amend "${image}:latest" \
          --amend "${image}:${VERSION}-amd64" \
          --amend "${image}:${VERSION}-arm64"
        docker manifest push --purge "${image}:latest"
      done

publish-release:
  extends: .docker-job
  stage: release
  tags:
    - debian-x86_64
  needs:
    - create-manifest
  script:
    - |
      if [ "$RELEASE_NEEDED" != true ]; then
        echo "Version is unchanged; skipping tag and release."
        exit 0
      fi

      previous_tag="$(git tag --merged "$CI_COMMIT_SHA" --sort=-version:refname |
        grep -Fvx "$VERSION" | head -n 1 || true)"

      if [ -n "$previous_tag" ]; then
        {
          echo "Changes since \`${previous_tag}\`:"
          echo
          git log --no-merges --pretty=format:'- %s (`%h`)' \
            "${previous_tag}..${CI_COMMIT_SHA}"
          echo
        } > release-notes.md
      else
        {
          echo "Changes through \`${CI_COMMIT_SHA}\`:"
          echo
          git log --no-merges --pretty=format:'- %s (`%h`)' "$CI_COMMIT_SHA"
          echo
        } > release-notes.md
      fi

      curl --fail --show-error --silent \
        --request POST \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --data-urlencode "name=${VERSION}" \
        --data-urlencode "tag_name=${VERSION}" \
        --data-urlencode "ref=${CI_COMMIT_SHA}" \
        --data-urlencode "description@release-notes.md" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
