name: Build and publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  RESTY_VERSION: 1.31.3.1
  RESTY_RELEASE: 343
  HARBOR_IMAGE: registry.hanada.info/openresty/openresty

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    env:
      DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/openresty

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve GHCR image name
        id: images
        shell: bash
        run: echo "ghcr_image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: registry.hanada.info
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            RESTY_VERSION=${{ env.RESTY_VERSION }}
            RESTY_RELEASE=${{ env.RESTY_RELEASE }}
          tags: |
            ${{ env.HARBOR_IMAGE }}:${{ env.RESTY_VERSION }}.${{ env.RESTY_RELEASE }}-${{ matrix.suffix }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.RESTY_VERSION }}.${{ env.RESTY_RELEASE }}-${{ matrix.suffix }}
            ${{ steps.images.outputs.ghcr_image }}:${{ env.RESTY_VERSION }}.${{ env.RESTY_RELEASE }}-${{ matrix.suffix }}

  manifest:
    name: Publish multi-platform manifests
    needs:
      - build
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/openresty

    steps:
      - name: Resolve GHCR image name
        id: images
        shell: bash
        run: echo "ghcr_image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: registry.hanada.info
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-platform manifests
        shell: bash
        env:
          GHCR_IMAGE: ${{ steps.images.outputs.ghcr_image }}
        run: |
          for image in "$HARBOR_IMAGE" "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            docker buildx imagetools create \
              --tag "${image}:${RESTY_VERSION}.${RESTY_RELEASE}" \
              --tag "${image}:latest" \
              "${image}:${RESTY_VERSION}.${RESTY_RELEASE}-amd64" \
              "${image}:${RESTY_VERSION}.${RESTY_RELEASE}-arm64"
          done
