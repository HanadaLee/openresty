name: Build and publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  HARBOR_IMAGE: registry.hanada.info/openresty/openresty
  DOCKERHUB_IMAGE: docker.io/hanadalee/openresty
  GHCR_IMAGE: ghcr.io/hanadalee/openresty

jobs:
  prepare:
    name: Read version from Dockerfile
    runs-on: ubuntu-24.04
    outputs:
      resty_version: ${{ steps.version.outputs.resty_version }}
      resty_release: ${{ steps.version.outputs.resty_release }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Extract image version
        id: version
        shell: bash
        run: |
          resty_version="$(sed -n 's/^ARG RESTY_VERSION="\([^"]*\)"[[:space:]]*$/\1/p' Dockerfile | head -n 1)"
          resty_release="$(sed -n 's/^ARG RESTY_RELEASE="\([^"]*\)"[[:space:]]*$/\1/p' Dockerfile | head -n 1)"

          if [[ -z "$resty_version" || -z "$resty_release" ]]; then
            echo "Failed to read RESTY_VERSION or RESTY_RELEASE from Dockerfile" >&2
            exit 1
          fi

          echo "resty_version=$resty_version" >> "$GITHUB_OUTPUT"
          echo "resty_release=$resty_release" >> "$GITHUB_OUTPUT"
          echo "version=${resty_version}.${resty_release}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: registry.hanada.info
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            RESTY_VERSION=${{ needs.prepare.outputs.resty_version }}
            RESTY_RELEASE=${{ needs.prepare.outputs.resty_release }}
          tags: |
            ${{ env.HARBOR_IMAGE }}:${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
            ${{ env.GHCR_IMAGE }}:${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}

  manifest:
    name: Publish multi-platform manifests
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: registry.hanada.info
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-platform manifests
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for image in "$HARBOR_IMAGE" "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            docker buildx imagetools create \
              --tag "${image}:${VERSION}" \
              --tag "${image}:latest" \
              "${image}:${VERSION}-amd64" \
              "${image}:${VERSION}-arm64"
          done
