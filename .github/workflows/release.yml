name: Publish release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      commit:
        required: false
        type: string
        default: ""
    secrets:
      GITLAB_USERNAME:
        required: true
      GITLAB_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish or repair
        required: true
        type: string
      commit:
        description: Full commit SHA for the release tag
        required: true
        type: string
      publish_manifests:
        description: Recreate and publish container manifests
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  HARBOR_IMAGE: registry.hanada.info/openresty/openresty
  DOCKERHUB_IMAGE: docker.io/hanadalee/openresty
  GHCR_IMAGE: ghcr.io/hanadalee/openresty
  GITLAB_REPOSITORY: https://git.hanada.info/hanada/openresty.git
  GITLAB_API_URL: https://git.hanada.info/api/v4
  GITLAB_PROJECT_ID: "22"

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  manifest:
    name: Publish multi-platform manifests
    if: github.event_name != 'workflow_dispatch' || inputs.publish_manifests
    runs-on: ubuntu-24.04

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: registry.hanada.info
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-platform manifests
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          for image in "$HARBOR_IMAGE" "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            docker buildx imagetools create \
              --tag "${image}:${VERSION}" \
              --tag "${image}:latest" \
              "${image}:${VERSION}-amd64" \
              "${image}:${VERSION}-arm64"
          done

  release:
    name: Publish tags and releases
    needs:
      - manifest
    if: >-
      always() &&
      (needs.manifest.result == 'success' || needs.manifest.result == 'skipped')
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Synchronize tags and publish releases
        shell: bash
        env:
          COMMIT: ${{ inputs.commit || github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash util/ci/sync-release-tag.sh "$COMMIT" "$VERSION"
          git push origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          bash util/ci/release-notes.sh "$COMMIT" "$VERSION"
          bash util/ci/publish-gitlab-release.sh \
            "$VERSION" release-notes.md

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "GitHub release ${VERSION} already exists"
          else
            gh release create "$VERSION" \
              --verify-tag \
              --target "$COMMIT" \
              --title "$VERSION" \
              --notes-file release-notes.md
          fi
