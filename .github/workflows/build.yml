name: Build and test images

on:
  workflow_call:
    inputs:
      resty_version:
        required: true
        type: string
      resty_release:
        required: true
        type: string
      version:
        required: true
        type: string
      publish_arch_images:
        required: true
        type: boolean

env:
  HARBOR_IMAGE: registry.hanada.info/openresty/openresty
  DOCKERHUB_IMAGE: docker.io/hanadalee/openresty
  GHCR_IMAGE: ghcr.io/hanadalee/openresty

jobs:
  build:
    name: Test ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build debug test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          build-args: |
            RESTY_VERSION=${{ inputs.resty_version }}
            RESTY_RELEASE=${{ inputs.resty_release }}
            RESTY_DEBUG_OPTIONS=--with-debug
          tags: openresty-patch-test:${{ inputs.version }}-${{ matrix.suffix }}

      - name: Verify debug test image
        shell: bash
        env:
          TEST_IMAGE: openresty-patch-test:${{ inputs.version }}-${{ matrix.suffix }}
        run: |
          set -euo pipefail
          bash util/ci/verify-image.sh debug "$TEST_IMAGE"

      - name: Assemble and run patch tests
        shell: bash
        env:
          TEST_IMAGE: openresty-patch-test:${{ inputs.version }}-${{ matrix.suffix }}
        run: |
          set -euo pipefail
          bash util/ci/run-patch-tests.sh "$TEST_IMAGE"

      - name: Build production architecture image
        if: inputs.publish_arch_images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          build-args: |
            RESTY_VERSION=${{ inputs.resty_version }}
            RESTY_RELEASE=${{ inputs.resty_release }}
          tags: |
            ${{ env.HARBOR_IMAGE }}:${{ inputs.version }}-${{ matrix.suffix }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ inputs.version }}-${{ matrix.suffix }}
            ${{ env.GHCR_IMAGE }}:${{ inputs.version }}-${{ matrix.suffix }}

      - name: Verify production image
        if: inputs.publish_arch_images
        shell: bash
        env:
          PRODUCTION_IMAGE: ${{ env.GHCR_IMAGE }}:${{ inputs.version }}-${{ matrix.suffix }}
        run: |
          set -euo pipefail
          bash util/ci/verify-image.sh production "$PRODUCTION_IMAGE"

      - name: Log in to Harbor
        if: inputs.publish_arch_images
        uses: docker/login-action@v4
        with:
          registry: registry.hanada.info
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Log in to Docker Hub
        if: inputs.publish_arch_images
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: inputs.publish_arch_images
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push architecture image
        if: inputs.publish_arch_images
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          ARCH_SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          bash util/ci/push-architecture-images.sh "$VERSION" "$ARCH_SUFFIX"
